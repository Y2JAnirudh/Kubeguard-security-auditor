apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: default
  labels:
    app: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      containers:
        - name: payment-api
          image: payment-service:latest
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
          env:
            - name: DB_PASSWORD
              value: "DEMO_NOT_A_REAL_PASSWORD"
            - name: STRIPE_API_KEY
              value: "sk_test_DEMO_FAKE_STRIPE_KEY_NOT_REAL"
          volumeMounts:
            - name: host-root
              mountPath: /host-system
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
