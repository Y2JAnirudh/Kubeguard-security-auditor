apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.payments.internal.corp
      secretName: payment-tls-certificate
  rules:
    - host: api.payments.internal.corp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-api-service
                port:
                  number: 8080
